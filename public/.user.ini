; Raises the default upload caps (2M/8M) so a member's avatar photo — resized/re-encoded
; server-side before storage anyway, see AvatarUploader — and an admin-uploaded document (see
; UserFileUploader, capped at 15MB there) aren't rejected before they even reach app code. Read
; per-directory by PHP-FPM (what heroku-php-apache2 and most local dev servers run on), so this
; lives in public/ alongside the front controller rather than the project root.
upload_max_filesize = 15M
post_max_size = 16M
