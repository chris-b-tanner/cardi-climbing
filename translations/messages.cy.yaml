mission_eyebrow: "Ein Cenhadaeth"
mission_h2: "Dylai dringo berthyn i bawb"
mission_p1: "Mae Y Wal yn fenter dan arweiniad y gymuned i ddod â chyfleuster dringo dan do i Aberteifi a rhanbarth ehangach Gorllewin Cymru. Mae'r wal ddringo agosaf dros awr o daith car i ffwrdd — rydym am newid hynny."
mission_p2: "Ein gweledigaeth yw gofod cynhwysol, fforddiadwy lle gall plant, teuluoedd, dringwyr profiadol a dechreuwyr hollol ddarganfod llawenydd symud ar y wal. Mae dringo'n meithrin hyder, cryfder corfforol, sgiliau datrys problemau, a chysylltiadau cymunedol gwirioneddol."
mission_p3: "Wedi'i wreiddio yn nhraddodiad Aberteifi o antur awyr agored ac ysbryd cymunedol, bydd y wal yn cael ei rhedeg fel sefydliad di-elw — unrhyw warged yn cael ei ailfuddsoddi mewn rhaglenni, mynediad â chymhorthdal, a'r cyfleuster ei hun."
mission_cta: "Gweld y Cynllun"

pillar_1_title: "Hygyrch i Bawb"
pillar_1_body: "Tocynnau â chymhorthdal a llogi offer fel nad yw cost byth yn rhwystr i gyfranogi."
pillar_2_title: "Ysgolion a Phobl Ifanc"
pillar_2_body: "Rhaglenni ieuenctid pwrpasol, sesiynau â chwricwlwm, a chlybiau ar ôl ysgol."
pillar_3_title: "Wedi'i Wreiddio yn y Lle"
pillar_3_body: "Yn eiddo i'r gymuned ac yn cael ei lywodraethu ganddi, yn ategu'r creigiau a chlogwyni môr ar ein drws."
pillar_4_title: "Di-elw"
pillar_4_body: "Mae gwarged yn mynd yn ôl i'r cyfleuster a mynediad â chymhorthdal — nid cyfranddalwyr."

plan_eyebrow: "Y Cynllun"
plan_h2: "O Weledigaeth<br>i Realiti"
plan_intro: "Mae gennym ffordd glir, raddedig i fynd â Y Wal o uchelgais cymunedol i agor y drysau. Dyma lle rydym ac i ble rydym yn mynd."
phase_label: "CAM"

phase_1_title: "Cymuned ac Ymarferoldeb"
phase_1_body: "Adeiladu'r tîm sylfaenol, cynnal arolwg anghenion cymunedol, ac adnabod eiddo addas yng nghanol tref Aberteifi neu yn ei ymyl. Sefydlu Cymdeithas Budd Cymunedol i ddal yr ased yn y tymor hir. <strong>Ar y gweill.</strong>"
phase_2_title: "Cyllido a Gwirfoddolwyr"
phase_2_body: "Sicrhau cymysgedd o grantiau, cyfranddaliadau cymunedol, a buddsoddiad preifat. Sefydlu Cymdeithas Budd Cymunedol i ddal yr ased yn y tymor hir."
phase_3_title: "Adeiladu a Ffitio Allan"
phase_3_body: "Bydd yr adeiladu a'r ffitio allan yn cael ei gwblhau'n gyfan gwbl gan y gymuned, gyda chyngor arbenigol gan hyfforddwyr dringo cymwysedig ac ysbrydoliaeth gan waliau bouldering cymunedol eraill."
phase_4_title: "Agor y Drysau"
phase_4_body: "Lansio gyda rhaglen lawn o sesiynau, cyrsiau, a digwyddiadau cymunedol. Ailfuddsoddi gwarged mewn mynediad â chymhorthdal o'r diwrnod cyntaf."

features_title: "Beth fydd y wal yn ei gynnwys"
feature_1: "Ardal bouldering ar gyfer pob lefel sgiliau"
feature_2: "Llogi offer (harneisiau, esgidiau, sialc)"
feature_3: "Gofod hyfforddi iau pwrpasol"
feature_4: "Ystafelloedd newid a chyfleusterau hygyrch"
feature_5: "Caffi ac ardal gymdeithasol"
feature_6: "Archebu hyblyg i ysgolion a grwpiau"
feature_7: "Sesiynau hyfforddi a chyfarwyddyd"
feature_8: "Tocynnau dydd, aelodaethau, ac archebu bloc"

adv_eyebrow: "Hwb Antur"
adv_h2: "Eich Porth i Antur Gorllewin Cymru"
adv_intro: "Mae Y Wal yn fwy na wal. Rydym yn adeiladu hwb ar gyfer antur awyr agored — yn cysylltu ymwelwyr a phobl leol â gweithgareddau o'r radd flaenaf ar hyd un o arfordiroedd mwyaf trawiadol Prydain."
adv_guided_title: "Tywys Preifat"
adv_1_title: "Arfordira"
adv_1_body: "Archwilio ogofâu môr, neidio oddi ar greigiau, a nofio trwy fylchau ar arfordir Penfro a Cheredigion gyda thywysyddion cymwysedig."
adv_2_title: "Dringo dan Arweiniad"
adv_2_body: "Ewch â'ch sgiliau i'r awyr agored ar glogwyni môr a chreigiau dramatig Gorllewin Cymru gyda'n tywysyddion mynydd profiadol."
adv_3_title: "Beicio Mynydd"
adv_3_body: "Archwilio llwybrau, lonydd, a rhostir Mynyddoedd Cambria a Bryniau'r Preseli ar ddwy olwyn — gyda thywysydd neu'n annibynnol."
adv_partners_title: "Partneriaid Antur"
adv_partners_intro: "Rydym yn gweithio'n agos gyda grŵp dethol o arbenigwyr lleol fel y gallwn eich cyfeirio at — neu archebu'n uniongyrchol gyda — y profiadau antur gorau sydd gan Orllewin Cymru i'w cynnig."
adv_cta: "Yn cynllunio ymweliad grŵp, taith ysgol, neu wyliau antur? Cysylltwch â ni a byddwn yn adeiladu eich rhaglen."
adv_cta_btn: "Cysylltwch â Ni"

involved_eyebrow: "Cymerwch Ran"
involved_h2: "Byddwch yn Rhan ohono"
way_1_title: "Gwirfoddoli"
way_1_body: "Rydym angen pobl â phob math o sgiliau — o godi arian a dylunio i reoli prosiectau, adeiladu, ac allgymorth cymunedol. Mae pob awr yn cyfrif."
way_2_title: "Cefnogwch Ni"
way_2_body: "Pan fydd ein hymgyrch godi arian yn lansio, byddem wrth ein bodd pe baech yn cyfrannu a rhannu'r newyddion! Cofrestrwch isod i fod y cyntaf i glywed."
way_3_title: "Lledaenwch y Gair"
way_3_body: "Dywedwch wrth eich ffrindiau, rhannwch ein stori gyda busnesau lleol, a siaradwch â ni am gyfleoedd partneriaeth, nawdd, neu gefnogaeth mewn nwyddau."

signup_eyebrow: "Cadwch mewn Cysylltiad"
signup_h2: "Derbyn Diweddariadau"
signup_body: "Cofrestrwch ar gyfer newyddion y prosiect, digwyddiadau cymunedol, a byddwch y cyntaf i glywed pan fydd ein hymgyrch godi arian yn mynd yn fyw."

