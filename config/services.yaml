parameters:
    app.site_url: 'https://www.cardiganclimbing.org'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $appEnv: '%kernel.environment%'
            string $mailerFrom: '%env(MAILER_FROM)%'
            string $mailerFromName: '%env(MAILER_FROM_NAME)%'
            string $webhookSecret: '%env(WEBHOOK_SECRET)%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
