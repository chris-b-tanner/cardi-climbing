security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

    role_hierarchy:
        ROLE_ADMIN:  [ROLE_STAFF, ROLE_MEMBER, ROLE_USER]
        ROLE_STAFF:  [ROLE_MEMBER, ROLE_USER]
        ROLE_MEMBER: [ROLE_USER]

    access_control: []
    #   Uncomment to restrict sections as the CRM is built out:
    #   - { path: ^/admin, roles: ROLE_ADMIN }
    #   - { path: ^/staff, roles: ROLE_STAFF }
    #   - { path: ^/members, roles: ROLE_MEMBER }
